# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Tests must not require these; empty values assert graceful degradation.
      IUCN_REDLIST_KEY: ""
      GFW_TOKEN: ""

    steps:
      - uses: actions/checkout@v6

      # Some ubuntu-latest runners default to the EC2 Ubuntu mirror, which can
      # take 10-30 minutes to download the system libraries setup-r installs.
      # The runner image points apt at a mirror list (mirror+file:) that puts
      # the EC2 mirror first, so replace it as well as any direct mirror URL.
      - name: Use the Azure Ubuntu mirror
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt -type f \( -name '*.sources' -o -name '*.list' \) \
            -exec sed -i -E \
              -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://azure.archive.ubuntu.com/ubuntu/#g' \
              -e 's#https?://[a-z0-9.-]*archive\.ubuntu\.com#http://azure.archive.ubuntu.com#g' {} +
          grep -rh '^URIs:\|^deb ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--no-build-vignettes", "--ignore-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--no-vignettes", "--ignore-vignettes")'
